<!DOCTYPE html>
<html lang="hu">
<head>

    <title>Regisztráció - Pentest Target</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input, textarea, select { 
            width: 100%; padding: 15px; border: 2px solid #e1e5e9; 
            border-radius: 10px; font-size: 16px; transition: all 0.3s;
        }
        input:focus, textarea:focus, select:focus { 
            border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .submit-btn { 
            width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-3px); }
        .success { background: #d4edda; color: #155724; padding: 20px; border-radius: 10px; text-align: center; }
        .admin-panel { 
            background: #1a1a1a; color: #00ff00; padding: 20px; border-radius: 10px; margin-top: 20px;
            display: none;
        }
        .admin-panel input { background: #333; color: #00ff00; border: 1px solid #00ff00; padding: 10px; }
        .admin-panel button { background: #00ff00; color: black; padding: 10px 20px; border: none; margin: 5px; cursor: pointer; }
        pre { background: #000; padding: 20px; border: 1px solid #00ff00; max-height: 400px; overflow: auto; white-space: pre-wrap; }
        .tab { display: none; }
        .tab.active { display: block; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; background: #f8f9fa; border: none; cursor: pointer; border-radius: 10px 10px 0 0; }
        .tab-btn.active { background: white; font-weight: bold; }
        #passwordInput { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">

                    <textarea name="address" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Születési dátum</label>

                </div>
                <div class="form-group">
                    <label>Cég / Munkahely</label>
                    <input type="text" name="company">
                </div>
                <div class="form-group">
                    <label>Beosztás</label>
                    <input type="text" name="position">
                </div>
                <div class="form-group">
                    <label>Jelszó *</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Hírlevél</label>
                    <select name="newsletter">
                        <option value="">Válassz...</option>
                        <option>Igen</option>
                        <option>Nem</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Regisztrálok! 🎁</button>
            </form>
            <div id="successMsg" class="success" style="display:none;">
                ✅ Sikeres regisztráció! Hamarosan felvesszük veled a kapcsolatot!

                <button onclick="clearData()">🗑️ Törlés</button>

            </div>
        </div>

    <script>
        let regsData = []; // Minden regisztráció itt gyűlik

        // TAB váltás
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // REGISZTRÁCIÓ KEZELÉSE
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Összes adat összegyűjtése
            const formData = new FormData(this);
            const entry = {
                timestamp: new Date().toLocaleString('hu-HU'),
                ip: 'Böngésző IP (lásd console)', // Kliens oldalon korlátozott
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer || 'direct',
                data: Object.fromEntries(formData)
            };
            
            // LocalStorage-ba mentés
            regsData.push(entry);
            localStorage.setItem('regsData', JSON.stringify(regsData));
            
            // Sikeres üzenet
            document.getElementById('regForm').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
            
            console.log('🆕 ÚJ REG:', entry); // Developer Tools-ban látható
        });

        // ADMIN BEJELENTKEZÉS
        function loginAdmin() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'PM17you5667.') {

                loadData();
            } else {
                alert('❌ Rossz jelszó!');
            }
        }

        // ADAT BETÖLTÉS
        function loadData() {
            const saved = localStorage.getItem('regsData');
            if (saved) {
                regsData = JSON.parse(saved);
                displayData();
            }
        }

        // ADATOK MEGJELENÍTÉSE
        function displayData() {
            let html = '';
            regsData.forEach((entry, i) => {
                html += `=== #${i+1} - ${entry.timestamp} ===\n`;
                html += `IP: ${entry.ip}\n`;
                html += `User-Agent: ${entry.userAgent.substring(0, 100)}...\n`;
                html += `Referer: ${entry.referrer}\n`;
                html += `URL: ${entry.url}\n\n`;
                Object.entries(entry.data).forEach(([key, value]) => {
                    html += `${key}: ${value}\n`;
                });
                html += '\n' + '='.repeat(50) + '\n\n';
            });
            document.getElementById('dataContent').textContent = html || 'Nincs adat még.';
        }

        // TXT LETÖLTÉS
        function downloadData() {
            const txt = document.getElementById('dataContent').textContent;
            const blob = new Blob([txt], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `regs_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
        }

        // ADAT TÖRLÉS
        function clearData() {
            if (confirm('Biztosan töröljük az összes adatot?')) {
                localStorage.removeItem('regsData');
                regsData = [];
                document.getElementById('dataContent').textContent = 'Adatok törölve.';
            }
        }

        // BETÖLTÉS INDÍTÓ

    </script>
</body>

</html>
